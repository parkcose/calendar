<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>html,body{margin:0;background:transparent;overflow:hidden;font-family:Georgia,serif}:root{--bg:#4B0F16;--head:#5E141B;--accent:#C9A66B;--text:#F7F1E6;--hover:#7A2A33}.cal{width:340px;background:var(--bg);border-radius:22px;padding:14px;color:var(--text);box-sizing:border-box}.h{display:flex;justify-content:space-between;align-items:center}.h button,.today{background:var(--head);color:var(--text);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.d,.c{text-align:center;padding:7px}.d{font-weight:bold}.o{opacity:.35}.t{background:var(--accent);color:#2b1d12;border-radius:8px}.today{width:100%;margin-top:8px}</style></head><body><div class='cal'><div class='h'><button onclick='chg(-1)'>&#9664;</button><b id='ttl'></b><button onclick='chg(1)'>&#9654;</button></div><div id='g' class='grid'></div><button class='today' onclick='today()'>Today</button></div><script>const g=document.getElementById('g'),d=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let cur=new Date();function draw(){g.innerHTML='';d.forEach(x=>{let e=document.createElement('div');e.className='d';e.textContent=x;g.appendChild(e)});ttl.textContent=cur.toLocaleString('en-US',{month:'long',year:'numeric'});let y=cur.getFullYear(),m=cur.getMonth(),s=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate(),n=new Date();for(let i=0;i<42;i++){let e=document.createElement('div');e.className='c';let num;if(i<s){num=pd-s+i+1;e.classList.add('o')}else if(i>=s+days){num=i-s-days+1;e.classList.add('o')}else{num=i-s+1;if(y==n.getFullYear()&&m==n.getMonth()&&num==n.getDate())e.classList.add('t')}e.textContent=num;g.appendChild(e)}}function chg(v){cur.setMonth(cur.getMonth()+v);draw()}function today(){cur=new Date();draw()}draw();</script></body></html>
