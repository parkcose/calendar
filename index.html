<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Academia Calendar</title>
<style>
:root{--bg:#4B0F16;--head:#5E141B;--card:#61161E;--accent:#C9A66B;--text:#F7F1E6;--hover:#7A2A33}
body{margin:0;background:#f4efe8;font-family:Georgia,serif;display:flex;justify-content:center;align-items:center;height:100vh}
.cal{background:var(--bg);color:var(--text);padding:18px;border-radius:22px;width:360px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.header{display:flex;justify-content:space-between;align-items:center}
button{background:var(--head);color:var(--text);border:none;border-radius:10px;padding:8px 10px;cursor:pointer}
button:hover{background:var(--hover)}
#todayBtn{margin-top:12px;width:100%}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day,.cell{text-align:center;padding:8px}
.day{font-weight:bold;color:#dbcdb7}
.cell{border-radius:10px}
.cell:hover{background:var(--hover)}
.today{background:var(--accent);color:#2b1d12;font-weight:bold}
.other{opacity:.35}
</style></head><body>
<div class="cal">
<div class="header"><button onclick="chg(-1)">◀</button><div id="title"></div><button onclick="chg(1)">▶</button></div>
<div class="grid" id="days"></div>
<button id="todayBtn" onclick="today()">Today</button>
</div>
<script>
const dnames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const g=document.getElementById("days");
dnames.forEach(x=>{let e=document.createElement("div");e.className="day";e.textContent=x;g.appendChild(e);});
let cur=new Date();
function render(){
document.querySelectorAll(".cell").forEach(e=>e.remove());
let y=cur.getFullYear(),m=cur.getMonth();
document.getElementById("title").textContent=cur.toLocaleString("en-US",{month:"long",year:"numeric"});
let first=new Date(y,m,1);let start=(first.getDay()+6)%7;
let days=new Date(y,m+1,0).getDate();let prevDays=new Date(y,m,0).getDate();
let t=new Date();
for(let i=0;i<42;i++){
 let c=document.createElement("div");c.className="cell";
 let num;
 if(i<start){num=prevDays-start+i+1;c.classList.add("other");}
 else if(i>=start+days){num=i-start-days+1;c.classList.add("other");}
 else{num=i-start+1;
 if(y==t.getFullYear()&&m==t.getMonth()&&num==t.getDate())c.classList.add("today");
 }
 c.textContent=num;g.appendChild(c);
}}
function chg(n){cur.setMonth(cur.getMonth()+n);render();}
function today(){cur=new Date();render();}
render();
</script></body></html>
